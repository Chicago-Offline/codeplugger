      - "us_marine_vhf_ch11"
      - "us_marine_vhf_ch12"
      - "us_marine_vhf_ch13"
      - "us_marine_vhf_ch14"
      - "us_marine_vhf_ch15"
      - id: "us_marine_vhf_ch16"
        display_name: "Ch 16 Dist"
      - "us_marine_vhf_ch17"
      - id: "us_marine_vhf_ch18a"
