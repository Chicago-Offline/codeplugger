$schema: "https://raw.githubusercontent.com/Chicago-Offline/codeplugger/main/schemas/profile-0.1.schema.json"
version: "0.1"
id: "example_uv_pro"
name: "Example UV-Pro"
radio: "btech_uv_pro"
radio_instance: "example_uv_pro_01"
# A Bluetooth-programmed Benshi radio: zones map to the radio's regions and
# names are limited to 10 characters. Exports as a benlink plan.
zones:
  - id: "ham"
    name: "Ham"
    assignments:
      # Shortened for the 10-character UV-Pro name field.
      - id: "us_ham_vhf_call"
        display_name: "2m Call"
      - id: "us_ham_uhf_call"
        display_name: "70cm Call"
  - id: "murs"
    name: "MURS"
    assignments:
      - "asgn_murs_1"
      - "asgn_murs_2"
      - "asgn_murs_3"
      - id: "asgn_murs_4"
        display_name: "MURS 4 Blu"
      - id: "asgn_murs_5"
        display_name: "MURS 5 Grn"
  - id: "gmrs"
    name: "GMRS"
    assignments:
      - "asgn_gmrs_01"
      - "asgn_gmrs_02"
      - "asgn_gmrs_03"
      - "asgn_gmrs_04"
      - "asgn_gmrs_05"
      - "asgn_gmrs_06"
      - "asgn_gmrs_07"
  - id: "weather"
    name: "Weather"
    assignments:
      - "asg_wx1"
      - "asg_wx2"
      - "asg_wx3"
      - "asg_wx4"
      - "asg_wx5"
      - "asg_wx6"
      - "asg_wx7"
