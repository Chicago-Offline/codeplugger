[project]
name = "codeplugger"
version = "0.1.0"
description = "Build radio codeplugs from SSRF data and explicit user profiles"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0.1",
  "ssrf-lite @ git+https://github.com/Chicago-Offline/ssrf-lite.git@6bf4f87131ba6592ebacbb5e84fd778c6459342b",
]

[project.scripts]
codeplugger-profile = "codeplugger.profile:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeplugger"]

[tool.hatch.metadata]
allow-direct-references = true