[project]
name = "codeplugger"
version = "0.1.0"
description = "Build radio codeplugs from SSRF data and explicit user profiles"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0.1",
  "tomlkit>=0.13",
  "ssrf-lite @ git+https://github.com/Chicago-Offline/ssrf-lite.git@bb78a3967529f6bbab7ff7dade183e1b3c0eb21d",
]

[project.scripts]
codeplugger-profile = "codeplugger.profile:main"
codeplugger-fleet = "codeplugger.fleet:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeplugger"]

[tool.hatch.metadata]
allow-direct-references = true