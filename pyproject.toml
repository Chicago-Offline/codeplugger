[project]
name = "codeplugger"
version = "0.1.0"
description = "Build radio codeplugs from SSRF data and explicit user profiles"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "pyyaml>=6.0.1",
  "tomlkit>=0.13",
  "ssrf-lite @ git+https://github.com/Chicago-Offline/ssrf-lite.git@72ccad1bb8482ce17a00aed702aec146da587635",
]

[project.scripts]
codeplugger-profile = "codeplugger.profile:main"
codeplugger-fleet = "codeplugger.fleet:main"

[project.optional-dependencies]
# Benshi radios (Vero VR-N76, BTECH UV-Pro and relatives) are programmed over
# Bluetooth; benlink is Apache-2.0 like codeplugger, so the backend imports it
# rather than shelling out the way the GPL-3 CHIRP path has to. Pinned to the
# Chicago Offline fork because region (channel bank) read/write is not in an
# upstream release yet; see khusmann/benlink#28.
benlink = [
  "benlink @ git+https://github.com/emuehlstein/benlink.git@n76-support",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeplugger"]

[tool.hatch.metadata]
allow-direct-references = true